; Harkenn speaker firmware for the Spotpear ESP32-S3 1.28" BOX (ESP32-S3 N16R8, GC9A01, CST816D, ES8311).
; Pins are in src/board.h. Device protocol: ../docs/PROTOCOL.md.

[env:harkenn-speaker]
; pioarduino: community-maintained PlatformIO platform with the current Arduino-ESP32 (3.x, ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  '-DFW_VERSION="0.14.0"'
  '-DHARDWARE_ID="sp-esp32-s3-1.28-box"'
  ; TensorFlow Lite Micro for the wake word (lib/tflm, lib/esp-nn; see tools/vendor_tflm.py)
  -DTF_LITE_STATIC_MEMORY
  -DTF_LITE_DISABLE_X86_NEON
  -Ilib/tflm/third_party/flatbuffers/include
  -Ilib/tflm/third_party/gemmlowp
  -Ilib/tflm/third_party/ruy
  -Ilib/tflm/third_party/kissfft
  -Ilib/tflm/third_party/kissfft/tools
  -Ilib/esp-nn/include

lib_deps =
  lvgl/lvgl @ ~9.2.2
  lovyan03/LovyanGFX @ ^1.2.7
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^7.2.1

; Hardware probe: logs GPIO changes and I2C devices (probe/probe.cpp). Flash with `pio run -e probe -t upload`.
[env:probe]
extends = env:harkenn-speaker
build_src_filter = -<*> +<../probe/>
lib_deps =
